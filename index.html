<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f3eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="B.Tech Maker — One platform for engineering students. Notes, PYQs, internships, mentorship, hackathons and career guidance." />
    <title>B.Tech Maker — Engineering, Made Navigable</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify detects this static form at deploy time. The React form submits the same fields. -->
    <form name="btech-maker-registration" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="course" />
      <input type="text" name="branch" />
      <input type="tel" name="contactNumber" />
      <input type="email" name="email" />
      <textarea name="suggestion"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
